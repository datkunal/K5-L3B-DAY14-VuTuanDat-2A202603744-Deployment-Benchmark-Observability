# Exercise 7.3 — Quality gate: chặn merge khi chất lượng agent giảm.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có regression so với --baseline,
# nên step fail → job fail → PR bị chặn (bật "Require status checks to pass" cho nhánh main).
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2 (tắt lỗi/chậm ngẫu nhiên để kết quả ổn định)
        env:
          AGENT_VERSION: v2
          PORT: "8000"
          MOCK_ERROR_RATE: "0"
          MOCK_SLOW_RATE: "0"
        run: |
          nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "agent không lên"; cat agent.log; exit 1

      - name: Eval — fail nếu accuracy < 85% hoặc có regression so với baseline
        run: |
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 0.85 \
            --baseline reports/eval_v2_fixed.json \
            --out reports/eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
          if-no-files-found: ignore
