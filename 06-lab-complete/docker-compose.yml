# ============================================================
# Agent + Redis bằng một lệnh (tiêu chí 2):
#   cp .env.example .env   # đặt AGENT_API_KEY
#   docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    environment:
      PORT: "8000"
      AGENT_API_KEY: ${AGENT_API_KEY:-}  # lấy từ .env hoặc shell; trống → /ask trả 401 (fail closed)
      REDIS_URL: redis://redis:6379/0   # ghi đè giá trị trong .env: trong compose Redis là service "redis"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # bật AOF: state còn sau khi restart Redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
