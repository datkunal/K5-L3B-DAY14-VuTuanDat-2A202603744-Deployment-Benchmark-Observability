# ============================================================
# Deploy Railway (tiêu chí 12). Đặt Root Directory của service = 06-lab-complete.
# Biến môi trường đặt trên Railway (KHÔNG ghi ở đây):
#   AGENT_API_KEY  (secret), REDIS_URL = ${{Redis.REDIS_URL}}, ENVIRONMENT=production
# PORT do Railway cấp, Dockerfile CMD đã đọc ${PORT}.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
