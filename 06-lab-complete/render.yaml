# ============================================================
# Deploy Render bằng Blueprint (tiêu chí 12) — dùng thay railway.toml.
# Render → New → Blueprint → chọn repo → Blueprint Path: 06-lab-complete/render.yaml
# Đường dẫn Docker tính từ gốc repo.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false               # secret: nhập trên dashboard, không ghi vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: WEB_CONCURRENCY
        value: "1"                # gói free chỉ 512 MB RAM

  - type: keyvalue                # Redis-compatible của Render
    name: day14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction   # không tự xoá key rate limit / cost
    ipAllowList: []               # chỉ cho service trong Render truy cập
